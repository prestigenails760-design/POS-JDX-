function to24(time){let m=String(time||'').match(/(\d+):(\d+)\s*(AM|PM)/i);if(!m)return 0;let h=+m[1],min=+m[2];if(m[3].toUpperCase()==='PM'&&h!==12)h+=12;if(m[3].toUpperCase()==='AM'&&h===12)h=0;return h*60+min}

function renderYearCalendar(){

 let custOptions=`<option value="">New Walk-In / Select Customer</option>`+db.customers.map(c=>`<option value="${c.id}" ${ticket.customerId===c.id?'selected':''}>${c.name} • ${c.phone}</option>`).join('');
 let cats=[...new Set(db.services.map(s=>s.category))];
 let itemRows=ticket.items.map((it,i)=>`<div class="line-item"><div><b>${it.name}</b><div class="meta">${it.duration} min</div></div><select aria-label="Technician" onchange="ticket.items[${i}].techId=this.value;renderTicket()">${db.technicians.map(t=>`<option value="${t.id}" ${it.techId===t.id?'selected':''}>${t.name}</option>`).join('')}</select><input aria-label="Quantity" type="number" min="1" value="${it.qty}" onchange="ticket.items[${i}].qty=+this.value;renderTicket()"><input aria-label="Price" type="number" inputmode="decimal" value="${it.price}" onchange="ticket.items[${i}].price=+this.value;renderTicket()"><button class="btn small danger remove" onclick="ticket.items.splice(${i},1);renderTicket()">✕ Remove</button></div>`).join('')||'<div class="muted">Tap a service to add it to this ticket.</div>';
 let subtotal=ticketSubtotal(),tax=ticket.taxOn?subtotal*db.settings.taxRate/100:0,total=subtotal+tax+ticket.tip-ticket.discount;
 $('#page-ticket').innerHTML=pageHead('New Ticket','Create a ticket for an existing customer or a brand-new walk-in',`<button class="btn" onclick="newTicket();renderTicket()">Clear</button>`)+`<div class="ticket-layout"><div class="card ticket-panel"><div class="field"><label>Find Existing Customer</label><select onchange="selectTicketCustomer(this.value)">${custOptions}</select></div><div class="ticket-customer-box"><h4>${selectedCustomer?'Selected Customer':'New Walk-In Customer'}</h4>${selectedCustomer?`<div><b>${selectedCustomer.name}</b></div><div class="meta">${selectedCustomer.phone}</div><button class="btn small full-width" style="margin-top:8px" onclick="selectTicketCustomer('')">Use New Walk-In Instead</button>`:`<div class="stack"><div class="field"><label>Customer Name *</label><input id="ticketWalkInName" autocomplete="name" value="${escapeHtml(ticket.walkInName||'')}" placeholder="Type walk-in customer name" oninput="ticket.walkInName=this.value"></div><div class="field"><label>Mobile Phone *</label><input id="ticketWalkInPhone" type="tel" inputmode="tel" autocomplete="tel" value="${escapeHtml(ticket.walkInPhone||'')}" placeholder="(858) 555-0000" oninput="ticket.walkInPhone=this.value"></div><button class="btn good full-width" onclick="saveWalkInCustomerToTicket()">Save Customer to System</button></div>`}</div><h3 style="margin-top:14px">Categories</h3><div class="category-list">${cats.map(c=>`<button onclick="showCategory('${c.replaceAll("'","\\'")}')">${c}</button>`).join('')}</div><div id="ticketServices" class="service-list" style="margin-top:12px;max-height:260px">${db.services.slice(0,8).map(serviceButtonMini).join('')}</div></div><div class="card ticket-panel"><h3>Selected Services</h3>${itemRows}</div><div class="card ticket-panel"><h3>Ticket Summary</h3><div class="summary-line"><span>Customer</span><b>${selectedCustomer?.name||ticket.walkInName||'New Walk-In'}</b></div><div class="summary-line"><span>Subtotal</span><b>${money(subtotal)}</b></div><div class="summary-line"><span>Discount</span><input style="width:100px" type="number" inputmode="decimal" value="${ticket.discount}" onchange="ticket.discount=+this.value;renderTicket()"></div><div class="summary-line"><span>Tax <input type="checkbox" ${ticket.taxOn?'checked':''} onchange="ticket.taxOn=this.checked;renderTicket()"></span><b>${money(tax)}</b></div><div class="summary-line"><span>Tip</span><b>${money(ticket.tip)}</b></div><div class="summary-line total"><span>Total</span><span>${money(total)}</span></div><div class="stack" style="margin-top:14px"><button class="btn" onclick="openTip()">TIP</button><button class="btn warn" onclick="if(ensureTicketCustomer())payLaterModal()">Pay Later</button><button class="btn primary" onclick="prepareTicketCheckout()">Checkout</button><button class="btn good" onclick="holdTicket()">Save / Hold Ticket</button></div></div></div>`
}
function escapeHtml(v=''){return String(v).replace(/[&<>'"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]))}
function selectTicketCustomer(id){ticket.customerId=id;if(id){ticket.walkInName='';ticket.walkInPhone=''}renderTicket()}
function normalizePhone(v=''){return String(v).replace(/\D/g,'')}
function ensureTicketCustomer(){
 if(ticket.customerId)return true;
 let name=(ticket.walkInName||$('#ticketWalkInName')?.value||'').trim(),phone=(ticket.walkInPhone||$('#ticketWalkInPhone')?.value||'').trim();
 if(!name)return toast('Enter the walk-in customer name'),false;
 if(normalizePhone(phone).length<7)return toast('Enter a valid mobile phone number'),false;
 let existing=db.customers.find(c=>normalizePhone(c.phone)===normalizePhone(phone));
 if(existing){existing.name=name;ticket.customerId=existing.id}
 else{let c={id:uid('c'),name,phone,email:'',birthMonth:'',birthDay:'',visits:0,total:0,notes:'Walk-in customer',lastVisit:today(),createdAt:today()};db.customers.unshift(c);ticket.customerId=c.id}
 ticket.walkInName='';ticket.walkInPhone='';save();return true
}
function saveWalkInCustomerToTicket(){if(ensureTicketCustomer()){renderTicket();toast('Walk-in customer saved and selected')}}
function prepareTicketCheckout(){if(!ticket.items.length)return toast('Add at least one service');if(!ensureTicketCustomer())return;go('checkout')}

function serviceButtonMini(s){return `<button class="service-btn" onclick="addService('${s.id}')"><span><strong>${s.name}</strong><span class="meta">${s.duration} min</span></span><span class="price">${money(s.price)}</span></button>`}
function showCategory(c){$('#ticketServices').innerHTML=db.services.filter(s=>s.category===c).map(serviceButtonMini).join('')}
function addService(id,fromFloor=false){let s=db.services.find(x=>x.id===id);ticket.items.push({...s,qty:1,techId:db.technicians[0].id});toast(s.name+' added');if(fromFloor)go('ticket');else renderTicket()}
function ticketSubtotal(){return ticket.items.reduce((a,b)=>a+b.price*b.qty,0)}
function ticketTotal(){let sub=ticketSubtotal();return sub-ticket.discount+(ticket.taxOn?sub*db.settings.taxRate/100:0)+ticket.tip}
function renderCheckout(){let total=ticketTotal(),paid=ticket.payments.reduce((a,b)=>a+b.amount,0),balance=Math.max(0,total-paid);$('#page-checkout').innerHTML=pageHead('Checkout','Record payment, tip, receipt, or Pay Later',`<button class="btn" onclick="go('ticket')">← Back to Ticket</button>`)+`<div class="grid g2"><div class="card"><h3>Payment</h3><div class="grid g2"><button class="btn primary" onclick="addPayment('Cash')">Cash</button><button class="btn primary" onclick="addPayment('Card')">Card</button><button class="btn" onclick="addPayment('Zelle')">Zelle</button><button class="btn" onclick="addPayment('Gift Card')">Gift Card</button></div><div class="field" style="margin-top:12px"><label>Other Payment Method</label><select id="payMethod"><option>Debit Card</option><option>Apple Pay</option><option>Google Pay</option><option>Tap to Pay</option><option>Venmo</option><option>Cash App</option><option>Check</option><option>Store Credit</option><option>Membership Credit</option><option>Other</option></select></div><button class="btn" style="width:100%;margin-top:10px" onclick="addPayment($('#payMethod').value)">Add Selected Payment</button><h3 style="margin-top:18px">Payments Added</h3>${ticket.payments.map((p,i)=>`<div class="summary-line"><span>${p.method}</span><span>${money(p.amount)} <button class="btn small danger" onclick="ticket.payments.splice(${i},1);renderCheckout()">Remove</button></span></div>`).join('')||'<div class="muted">No payment recorded yet.</div>'}</div><div class="card"><h3>Amount Due</h3><div class="summary-line"><span>Ticket Total</span><b>${money(total)}</b></div><div class="summary-line"><span>Paid</span><b>${money(paid)}</b></div><div class="summary-line total"><span>Balance</span><span>${money(balance)}</span></div><div class="stack" style="margin-top:16px"><button class="btn" onclick="openTip()">Change TIP</button><button class="btn warn" onclick="payLaterModal()">Save Pay Later</button><button class="btn primary" onclick="completeSale()" ${balance>.009?'disabled style="opacity:.45"':''}>Complete Sale</button><button class="btn good" onclick="toast('Receipt preview opened')">Print Receipt</button><button class="btn" onclick="go('floor')">Return to Salon Floor</button></div></div></div>`}
function addPayment(method){let balance=Math.max(0,ticketTotal()-ticket.payments.reduce((a,b)=>a+b.amount,0));if(balance<=0)return toast('Ticket is already fully paid');let amount=prompt(`Enter ${method} amount`,balance.toFixed(2));if(amount===null)return;amount=Number(amount);if(!amount||amount<0)return toast('Enter a valid amount');ticket.payments.push({method,amount});renderCheckout()}
function completeSale(){if(!ticket.items.length)return toast('Add at least one service');if(!ensureTicketCustomer())return;let c=db.customers.find(x=>x.id===ticket.customerId);let total=ticketTotal();let rec={id:'R-'+(1000+db.receipts.length+1),date:today(),customer:c?.name||'Walk-In Guest',total,payment:ticket.payments.map(x=>x.method).join(' + ')||'Unrecorded',tech:[...new Set(ticket.items.map(i=>db.technicians.find(t=>t.id===i.techId)?.name))].join(', ')};db.receipts.unshift(rec);if(c){c.visits=(+c.visits||0)+1;c.total=(+c.total||0)+total;c.lastVisit=today()}save();toast('Sale completed');newTicket();go('receipts')}
function renderReceipts(){let rows=db.receipts.map(r=>`<tr><td>${r.id}</td><td>${r.date}</td><td>${r.customer}</td><td>${r.tech}</td><td>${r.payment}</td><td><b>${money(r.total)}</b></td><td><div class="actions"><button class="btn small">View</button><button class="btn small">Print</button><button class="btn small warn" onclick="managerAction('Refund ${r.id}')">Refund</button><button class="btn small danger" onclick="managerAction('Void ${r.id}')">Void</button></div></td></tr>`).join('');$('#page-receipts').innerHTML=pageHead('Receipt Center','Search, print, refund, or reopen transactions')+`<div class="card row wrap" style="margin-bottom:12px"><input class="btn" style="min-width:260px" placeholder="Search receipt, customer, phone"><button class="btn">Today</button><button class="btn">This Week</button><button class="btn">Payment Method</button></div><div class="table-wrap"><table class="table"><thead><tr><th>Receipt</th><th>Date</th><th>Customer</th><th>Technician</th><th>Payment</th><th>Total</th><th>Actions</th></tr></thead><tbody>${rows}</tbody></table></div><div class="card" style="margin-top:14px"><h3>Pay Later</h3>${db.payLater.map(p=>`<div class="row between"><div><b>${p.id} • ${p.customer}</b><div class="meta">Due ${p.due}</div></div><div><span class="badge warn">${p.status}</span> <b>${money(p.amount)}</b></div></div>`).join('')}</div>`}
function customerSegment(c){let days=Math.floor((new Date(today())-new Date((c.lastVisit||today())+'T12:00:00'))/86400000);if(days>=730)return '2+ Years';if(days>=365)return '1 Year';if(days>=180)return '6 Months';if(days>=90)return '3 Months';return (c.visits||0)<=1?'New':'Regular'}
function renderCustomers(){let segs=['All','New','Regular','3 Months','6 Months','1 Year','2+ Years','Birthdays'];let rows=db.customers.map(c=>`<tr data-segment="${customerSegment(c)}"><td><b>${c.name}</b><div class="meta">${c.email}</div></td><td>${c.phone}<div class="meta">Birthday: ${c.birthMonth||'--'}/${c.birthDay||'--'}</div></td><td><span class="badge">${customerSegment(c)}</span></td><td>${c.visits}</td><td>${money(c.total)}</td><td>${c.lastVisit||'—'}</td><td><div class="actions"><button class="btn small" onclick="customerProfile('${c.id}')">Profile</button><button class="btn small" onclick="ticket.customerId='${c.id}';go('ticket')">Start Ticket</button><button class="btn small" onclick="appointmentModal()">Book</button></div></td></tr>`).join('');$('#page-customers').innerHTML=pageHead('Customers','New, regular, birthday, and long-time-no-see customer groups',`<button class="btn primary" onclick="customerModal()">＋ New Customer</button>`)+`<div class="segment-tabs">${segs.map(x=>`<button class="btn small" onclick="filterCustomerSegment('${x}',this)">${x}</button>`).join('')}</div><div class="table-wrap"><table class="table"><thead><tr><th>Customer</th><th>Phone</th><th>Group</th><th>Visits</th><th>Total</th><th>Last Visit</th><th>Actions</th></tr></thead><tbody id="customerRows">${rows}</tbody></table></div>`}
function renderTechnicians(){ $('#page-technicians').innerHTML=pageHead('Technicians','Individual profiles, photos, clock, breaks, schedules, and pay',`<button class="btn primary" onclick="techProfileModal()">＋ Add Technician</button><button class="btn" onclick="timeClockDashboard()">Time Clock</button><button class="btn" onclick="payrollDashboard()">Payroll</button>`)+`<div class="grid g4">${db.technicians.map(t=>`<div class="card"><div class="row"><div class="profile-photo">${t.photo?`<img src="${t.photo}" style="width:100%;height:100%;object-fit:cover;border-radius:16px">`:t.name[0]}</div><div><h3 style="margin:0">${t.name}</h3><div class="meta">${t.role} • ${money(t.hourlyRate)}/hr</div><span class="badge ${statusClass(t.status)}">${t.clockStatus}</span></div></div><div class="summary-line"><span>Hours This Week</span><b>${(+t.hoursThisWeek||0).toFixed(1)}</b></div><div class="summary-line"><span>Daily Sales</span><b>${money(t.sales)}</b></div><div class="summary-line"><span>Tips</span><b>${money(t.tips)}</b></div><div class="actions"><button class="btn small primary" onclick="techProfileModal('${t.id}')">Open Profile</button><button class="btn small good" onclick="clockAction('${t.id}')">Clock / Break</button></div></div>`).join('')}</div>`}
function renderReports(){let revenue=db.receipts.reduce((a,b)=>a+b.total,0),discounts=db.receipts.reduce((a,b)=>a+(+b.discount||0),0),payroll=db.technicians.reduce((a,t)=>a+(+t.hoursThisWeek||0)*(+t.hourlyRate||0),0)*4.33,expenses=(+db.settings.suppliesCost||0)+(+db.settings.marketingCost||0)+(+db.settings.rentCost||0)+(+db.settings.otherCost||0),monthlyProfit=revenue-payroll-expenses-discounts;let counts={};db.customers.forEach(c=>counts[customerSegment(c)]=(counts[customerSegment(c)]||0)+1);$('#page-reports').innerHTML=pageHead('Business Reports','Revenue, payroll, costs, profit, and customer retention',`<button class="btn" onclick="expenseDashboard()">Costs</button><button class="btn" onclick="profitDashboard()">Quarter & Year Profit</button><button class="btn" onclick="exportData('csv')">Export CSV</button>`)+`<div class="kpi-grid"><div class="kpi"><span class="muted">Revenue</span><b>${money(revenue)}</b></div><div class="kpi"><span class="muted">Estimated Payroll</span><b>${money(payroll)}</b></div><div class="kpi"><span class="muted">Operating Costs</span><b>${money(expenses)}</b></div><div class="kpi"><span class="muted">Estimated Profit</span><b>${money(monthlyProfit)}</b></div></div><div class="grid g2" style="margin-top:14px"><div class="card"><h3>Customer Groups</h3>${['New','Regular','3 Months','6 Months','1 Year','2+ Years'].map(x=>`<div class="summary-line"><span>${x}</span><b>${counts[x]||0}</b></div>`).join('')}<button class="btn" onclick="go('customers')">Open Customer Segments</button></div><div class="card"><h3>Cost Breakdown</h3><div class="summary-line"><span>Supplies</span><b>${money(db.settings.suppliesCost)}</b></div><div class="summary-line"><span>Marketing</span><b>${money(db.settings.marketingCost)}</b></div><div class="summary-line"><span>Rent / Occupancy</span><b>${money(db.settings.rentCost)}</b></div><div class="summary-line"><span>Other</span><b>${money(db.settings.otherCost)}</b></div><button class="btn" onclick="expenseDashboard()">Edit Costs</button></div></div>`}
function renderSettings(){$('#page-settings').innerHTML=pageHead('Settings','Edit salon content, technicians, services, prices, payroll, costs, and integrations')+`<div class="management-grid"><button class="card management-tile" onclick="salonSettingsModal()"><h3>Salon Information</h3><span class="muted">Name, tax, tips, GHL booking link</span></button><button class="card management-tile" onclick="serviceManager()"><h3>Services & Prices</h3><span class="muted">Add services, edit price and duration</span></button><button class="card management-tile" onclick="techProfileModal()"><h3>Add Technician</h3><span class="muted">Photo, contact, skills, rate and schedule</span></button><button class="card management-tile" onclick="timeClockDashboard()"><h3>Time Clock</h3><span class="muted">Clock in/out, breaks and time history</span></button><button class="card management-tile" onclick="payrollDashboard()"><h3>Payroll Settings</h3><span class="muted">Hourly pay, commission and weekly labor</span></button><button class="card management-tile" onclick="expenseDashboard()"><h3>Costs & Discounts</h3><span class="muted">Supplies, marketing, rent and discounts</span></button><button class="card management-tile" onclick="profitDashboard()"><h3>Quarter & Annual Profit</h3><span class="muted">Revenue minus payroll and operating costs</span></button><button class="card management-tile" onclick="rolesModal()"><h3>Roles & Permissions</h3><span class="muted">Owner, manager, receptionist and technician</span></button><button class="card management-tile" onclick="printerModal()"><h3>Printer Setup</h3><span class="muted">Receipt printer and paper size</span></button><button class="card management-tile" onclick="exportData('json')"><h3>Backup Data</h3><span class="muted">Export salon data to JSON</span></button><button class="card management-tile" onclick="importData()"><h3>Import Data</h3><span class="muted">Restore a salon backup</span></button><button class="card management-tile" onclick="resetDemo()"><h3>Reset Demo</h3><span class="muted">Restore sample data</span></button></div>`}
function openTip(){let base=ticketSubtotal();openModal('TIP',`<div class="tip-grid"><button onclick="setTip(0)">No Tip</button><button onclick="setTip(${(base*.18).toFixed(2)})">18%<small style="display:block">${money(base*.18)}</small></button><button onclick="setTip(${(base*.25).toFixed(2)})">25%<small style="display:block">${money(base*.25)}</small></button><button onclick="setTip(${(base*.35).toFixed(2)})">35%<small style="display:block">${money(base*.35)}</small></button></div><div class="grid g2" style="margin-top:14px"><div class="field"><label>Custom Percentage</label><input id="customTipPct" type="number" placeholder="20"></div><div class="field"><label>Custom Dollar Amount</label><input id="customTipAmt" type="number" placeholder="25.00"></div></div><div class="card" style="box-shadow:none;margin-top:14px"><h3>Tip Split</h3><div class="row wrap"><button class="btn" onclick="setTipSplit('Equal')">Split Equally</button><button class="btn" onclick="setTipSplit('Service Total')">By Service Total</button><button class="btn" onclick="setTipSplit('Custom')">Custom Percentage</button><button class="btn" onclick="setTipSplit('One Technician')">Give All to One Tech</button></div></div>`,`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="applyCustomTip()">Apply TIP</button>`)}
function setTip(v){ticket.tip=+v;closeModal();render($('.page.active').id.replace('page-',''));toast('Tip updated')}
function applyCustomTip(){let pct=+$('#customTipPct').value,amt=+$('#customTipAmt').value;setTip(amt||ticketSubtotal()*pct/100)}
function payLaterModal(){if(!ensureTicketCustomer())return;let c=db.customers.find(x=>x.id===ticket.customerId);openModal('Pay Later',`<div class="stack"><div class="field"><label>Customer</label><input id="plCustomer" value="${c?.name||''}"></div><div class="field"><label>Amount Due</label><input id="plAmount" type="number" value="${ticketTotal().toFixed(2)}"></div><div class="field"><label>Due Date</label><input id="plDue" type="date" value="${today()}"></div><div class="field"><label>Reason / Notes</label><textarea id="plNotes" placeholder="Reason for Pay Later and manager approval"></textarea></div></div>`,`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn warn" onclick="savePayLater()">Save Pay Later</button>`)}
function savePayLater(){db.payLater.unshift({id:'PL-'+(201+db.payLater.length),customer:$('#plCustomer').value||'Guest',amount:+$('#plAmount').value,due:$('#plDue').value,status:'Open',notes:$('#plNotes').value});save();closeModal();toast('Pay Later saved');newTicket();go('floor')}
function openModal(title,body,foot=''){ $('#modalTitle').textContent=title;$('#modalBody').innerHTML=body;$('#modalFoot').innerHTML=foot;$('#modal').classList.add('open');document.body.style.overflow='hidden'}
function closeModal(){$('#modal').classList.remove('open');document.body.style.overflow=''}
function toast(msg){let t=$('#toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
function saveWalkin(start){let w={id:uid('w'),name:$('#wName').value||'Walk-In Guest',phone:$('#wPhone').value,service:$('#wService').value,tech:$('#wTech').value,wait:+$('#wWait').value,status:start?'Assigned':'Waiting',notes:$('#wNotes').value};db.walkins.push(w);save();if(start){ticket.customerId='';ticket.walkInName=w.name;ticket.walkInPhone=w.phone;let s=db.services.find(x=>x.name===w.service);if(s)ticket.items=[{...s,qty:1,techId:db.technicians.find(t=>t.name===w.tech)?.id||db.technicians[0].id}];go('ticket')}else{toast('Walk-in added');renderWalkin()}}
function nextTurn(){db.technicians.forEach(t=>t.turn=t.turn===db.technicians.length?1:t.turn+1);save();renderTurn()}
function resetTurn(){if(!confirm('Reset technician turn rotation?'))return;db.technicians.forEach((t,i)=>t.turn=i+1);save();renderTurn();toast('Turn rotation reset')}
function moveTurn(id,d){let t=db.technicians.find(x=>x.id===id),other=db.technicians.find(x=>x.turn===t.turn+d);if(!other)return;[t.turn,other.turn]=[other.turn,t.turn];save();renderTurn()}
function skipTech(id){let t=db.technicians.find(x=>x.id===id);t.turn=db.technicians.length;db.technicians.filter(x=>x.id!==id&&x.turn>t.turn).forEach(x=>x.turn--);save();renderTurn()}
function toggleTech(id){let t=db.technicians.find(x=>x.id===id);t.status=t.status==='Available'?'Busy':'Available';save();render($('.page.active').id.replace('page-',''))}
function assignNext(){let w=db.walkins.find(x=>x.status==='Waiting');if(!w)return toast('No waiting guest');let t=[...db.technicians].sort((a,b)=>a.turn-b.turn).find(x=>x.status==='Available');if(!t)return toast('No technician available');w.status='Assigned to '+t.name;t.status='Busy';save();nextTurn();toast(`${w.name} assigned to ${t.name}`)}
function checkInAppt(id){let a=db.appointments.find(x=>x.id===id);a.status='Checked In';save();renderAppointments();toast('Appointment checked in')}
function setApptStatus(id,status){db.appointments.find(x=>x.id===id).status=status;save();renderAppointments();toast('Status changed to '+status)}
function startApptTicket(id){let a=db.appointments.find(x=>x.id===id);ticket.customerId=a.customerId;let s=db.services.find(x=>x.name===a.service);if(s)ticket.items=[{...s,qty:1,techId:a.techId}];go('ticket')}
function walkinToTicket(id){let w=db.walkins.find(x=>x.id===id),s=db.services.find(x=>x.name===w.service);ticket={id:uid('T'),customerId:'',walkInName:w.name||'',walkInPhone:w.phone||'',items:s?[{...s,qty:1,techId:db.technicians[0].id}]:[],discount:0,tip:0,taxOn:true,payments:[]};go('ticket')}
function newTicket(){ticket={id:uid('T'),customerId:'',walkInName:'',walkInPhone:'',items:[],discount:0,tip:0,taxOn:true,payments:[]}}
function holdTicket(){toast('Ticket saved to this browser')}
function managerAction(name){let pin=prompt(name+' requires manager PIN','1234');toast(pin==='1234'?name+' approved':'Incorrect PIN')}
function customerModal(){openModal('New Customer',`<div class="stack"><div class="field"><label>Name</label><input id="cName"></div><div class="field"><label>Phone</label><input id="cPhone"></div><div class="field"><label>Email</label><input id="cEmail"></div><div class="grid g2"><div class="field"><label>Birthday Month</label><input id="cBirthMonth" type="number" min="1" max="12"></div><div class="field"><label>Birthday Day</label><input id="cBirthDay" type="number" min="1" max="31"></div></div><div class="field"><label>Notes</label><textarea id="cNotes"></textarea></div></div>`,`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveCustomer()">Save Customer</button>`)}
function saveCustomer(){db.customers.unshift({id:uid('c'),name:$('#cName').value||'New Customer',phone:$('#cPhone').value,email:$('#cEmail').value,birthMonth:String($('#cBirthMonth')?.value||'').padStart(2,'0'),birthDay:String($('#cBirthDay')?.value||'').padStart(2,'0'),visits:0,total:0,notes:$('#cNotes').value});save();closeModal();renderCustomers();toast('Customer saved')}
function appointmentModal(prefDate=today(),prefTime='10:00',prefTech=''){openModal('Book Appointment',`<div class="stack"><div class="ghl-box"><div class="row between"><div><b>Book inside this POS</b><div class="meta">The appointment appears on the scheduler immediately.</div></div><button class="btn" onclick="openGHLBooking()">Use GHL Booking</button></div></div><div class="grid g2"><div class="field"><label>Customer Name *</label><input id="aName" placeholder="Full name"></div><div class="field"><label>Phone Number *</label><input id="aPhone" inputmode="tel" placeholder="(858) 555-0000"></div><div class="field"><label>Birthday Month *</label><select id="aBirthMonth"><option value="">Select month</option>${Array.from({length:12},(_,i)=>`<option value="${String(i+1).padStart(2,'0')}">${new Date(2000,i,1).toLocaleString([],{month:'long'})}</option>`).join('')}</select></div><div class="field"><label>Birthday Day *</label><select id="aBirthDay"><option value="">Select day</option>${Array.from({length:31},(_,i)=>`<option value="${String(i+1).padStart(2,'0')}">${i+1}</option>`).join('')}</select></div><div class="field"><label>Technician</label><select id="aTech"><option value="">Any Technician</option>${db.technicians.map(t=>`<option value="${t.id}" ${prefTech===t.id?'selected':''}>${t.name}</option>`).join('')}</select></div><div class="field"><label>Date *</label><input id="aDate" type="date" value="${prefDate}"></div><div class="field"><label>Start Time *</label><input id="aTime" type="time" min="08:00" max="19:00" step="900" value="${prefTime}"></div><div class="field"><label>Service</label><select id="aService">${db.services.map(s=>`<option>${s.name}</option>`).join('')}</select></div><div class="field"><label>Appointment Length</label><select id="aDuration"><option value="15">15 minutes</option><option value="30">30 minutes</option><option value="60" selected>60 minutes</option><option value="90">90 minutes</option><option value="120">120 minutes / 2 hours</option><option value="150">150 minutes / 2.5 hours</option></select></div><div class="field"><label>Time Between Appointments</label><select id="aBuffer"><option value="0">No extra time</option><option value="15">Add 15 minutes</option><option value="30">Add 30 minutes</option></select></div><div class="field"><label>Deposit</label><input id="aDeposit" type="number" value="0"></div><div class="field"><label>Status</label><select id="aStatus"><option>Scheduled</option><option>Confirmed</option></select></div></div></div>`,`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveAppointment()">Save Appointment</button>`)}
function saveAppointment(){let name=$('#aName').value.trim(),phone=$('#aPhone').value.trim(),bm=$('#aBirthMonth').value,bd=$('#aBirthDay').value,date=$('#aDate').value,time24=$('#aTime').value;if(!name||!phone||!bm||!bd||!date||!time24)return toast('Name, phone, birthday, date and time are required');let c=db.customers.find(x=>x.phone.replace(/\D/g,'')===phone.replace(/\D/g,''));if(c){c.name=name;c.birthMonth=bm;c.birthDay=bd}else{c={id:uid('c'),name,phone,email:'',birthMonth:bm,birthDay:bd,visits:0,total:0,notes:''};db.customers.unshift(c)}let [hh,mm]=time24.split(':').map(Number),suffix=hh>=12?'PM':'AM',h12=hh%12||12,time=`${h12}:${String(mm).padStart(2,'0')} ${suffix}`;let duration=+$('#aDuration').value||60,buffer=+$('#aBuffer').value||0;let start=hh*60+mm,end=start+duration+buffer,conflict=db.appointments.find(a=>a.date===date&&a.techId===$('#aTech').value&&a.status!=='Cancelled'&&a.status!=='No Show'&&start<to24(a.time)+(a.duration||60)+(a.buffer||0)&&end>to24(a.time));if(conflict)return toast('This technician already has an appointment during that time');db.appointments.push({id:uid('a'),date,time,duration,buffer,customerId:c.id,techId:$('#aTech').value,service:$('#aService').value,status:$('#aStatus').value,deposit:+$('#aDeposit').value||0,source:'POS'});save();closeModal();appointmentRange=date===today()?'Today':'7 Days';go('appointments');toast('Appointment saved and displayed on calendar')}
function resetDemo(){if(!confirm('Reset all demo data?'))return;db=seed();save();newTicket();go('floor');toast('Demo data reset')}
function filterCheckin(){let q=$('#checkSearch').value.toLowerCase();$('#checkResults').innerHTML=db.appointments.filter(a=>{let c=db.customers.find(x=>x.id===a.customerId);return (c.name+c.phone+a.service).toLowerCase().includes(q)}).map(a=>{let c=db.customers.find(x=>x.id===a.customerId);return `<div class="card" style="box-shadow:none"><div class="row between"><div><b>${a.time} • ${c.name}</b><div class="meta">${a.service}</div></div><button class="btn good" onclick="checkInAppt('${a.id}')">Check In</button></div></div>`}).join('')||'<div class="muted">No matching appointments.</div>'}
function setTipSplit(mode){ticket.tipSplit=mode;toast('Tip split: '+mode)}
function showReport(name){openModal(name,`<div class="card" style="box-shadow:none"><h3>${name}</h3><p class="muted">Report generated from current LocalStorage salon data.</p><div class="grid g3"><div><div class="stat">${db.receipts.length}</div><div class="meta">Transactions</div></div><div><div class="stat">${money(db.receipts.reduce((a,r)=>a+r.total,0))}</div><div class="meta">Sales</div></div><div><div class="stat">${db.appointments.length}</div><div class="meta">Appointments</div></div></div></div>`,`<button class="btn" onclick="window.print()">Print</button><button class="btn primary" onclick="closeModal()">Close</button>`)}
function exportData(type='json'){let content,name,mime;if(type==='csv'){content='Receipt,Date,Customer,Total,Payment,Technician\n'+db.receipts.map(r=>[r.id,r.date,r.customer,r.total,r.payment,r.tech].map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\n');name='jdx-pos-report.csv';mime='text/csv'}else{content=JSON.stringify(db,null,2);name='jdx-pos-backup.json';mime='application/json'}let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type:mime}));a.download=name;a.click();URL.revokeObjectURL(a.href);toast('Export created')}
function importData(){let input=document.createElement('input');input.type='file';input.accept='.json,application/json';input.onchange=()=>{let f=input.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{db=JSON.parse(r.result);save();go('floor');toast('Data imported')}catch(e){alert('Invalid backup file')}};r.readAsText(f)};input.click()}
function rolesModal(){openModal('User Roles & Permissions',`<div class="stack">${['Owner','Manager','Receptionist','Technician','Cashier'].map((r,i)=>`<div class="card" style="box-shadow:none"><div class="row between"><b>${r}</b><span class="badge ${i===0?'good':''}">${i===0?'Full Access':'Configured'}</span></div><div class="meta">Reports, discounts, refunds, settings and customer-note permissions.</div></div>`).join('')}</div>`,`<button class="btn primary" onclick="closeModal()">Done</button>`)}

function filterCustomerSegment(seg,btn){$$('.segment-tabs button').forEach(b=>b.classList.remove('primary'));btn.classList.add('primary');let now=new Date(),month=String(now.getMonth()+1).padStart(2,'0');$$('#customerRows tr').forEach(r=>{let c=db.customers.find(x=>r.innerText.includes(x.name));let show=seg==='All'||(seg==='Birthdays'?c?.birthMonth===month:r.dataset.segment===seg);r.style.display=show?'':'none'})}
function customerProfile(id){let c=db.customers.find(x=>x.id===id);openModal('Customer Profile',`<div class="grid g2"><div class="field"><label>Name</label><input id="cpName" value="${c.name}"></div><div class="field"><label>Phone</label><input id="cpPhone" value="${c.phone}"></div><div class="field"><label>Email</label><input id="cpEmail" value="${c.email||''}"></div><div class="field"><label>Last Visit</label><input id="cpLast" type="date" value="${c.lastVisit||today()}"></div><div class="field"><label>Birthday Month</label><input id="cpBM" value="${c.birthMonth||''}"></div><div class="field"><label>Birthday Day</label><input id="cpBD" value="${c.birthDay||''}"></div><div class="field" style="grid-column:1/-1"><label>Notes</label><textarea id="cpNotes">${c.notes||''}</textarea></div></div>`,`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveCustomerProfile('${id}')">Save Profile</button>`)}
function saveCustomerProfile(id){let c=db.customers.find(x=>x.id===id);Object.assign(c,{name:$('#cpName').value,phone:$('#cpPhone').value,email:$('#cpEmail').value,lastVisit:$('#cpLast').value,birthMonth:$('#cpBM').value,birthDay:$('#cpBD').value,notes:$('#cpNotes').value});save();closeModal();renderCustomers();toast('Customer profile saved')}
function techProfileModal(id=''){let t=db.technicians.find(x=>x.id===id)||{id:'',name:'',phone:'',email:'',birthday:'',address:'',emergencyContact:'',hireDate:today(),role:'Technician',skills:[],photo:'',hourlyRate:18,commissionRate:0,status:'Available',clockStatus:'Clocked Out'};openModal(id?'Technician Profile':'Add Technician',`<div class="row" style="margin-bottom:14px"><img id="techPreview" class="upload-preview" src="${t.photo||''}" onerror="this.style.visibility='hidden'"><div><button class="btn" onclick="$('#techPhoto').click()">Upload Photo</button><input id="techPhoto" type="file" accept="image/*" hidden onchange="previewTechPhoto(this)"><div class="meta">JPG or PNG stored in this browser</div></div></div><div class="grid g2"><div class="field"><label>Full Name *</label><input id="tpName" value="${t.name}"></div><div class="field"><label>Role</label><select id="tpRole">${['Technician','Manager','Receptionist'].map(x=>`<option ${t.role===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Phone</label><input id="tpPhone" value="${t.phone}"></div><div class="field"><label>Email</label><input id="tpEmail" value="${t.email}"></div><div class="field"><label>Birthday</label><input id="tpBirthday" type="date" value="${t.birthday}"></div><div class="field"><label>Hire Date</label><input id="tpHire" type="date" value="${t.hireDate}"></div><div class="field"><label>Hourly Rate</label><input id="tpRate" type="number" step=".01" value="${t.hourlyRate}"></div><div class="field"><label>Commission %</label><input id="tpCommission" type="number" step=".01" value="${t.commissionRate}"></div><div class="field"><label>Emergency Contact</label><input id="tpEmergency" value="${t.emergencyContact}"></div><div class="field"><label>Skills</label><input id="tpSkills" value="${(t.skills||[]).join(', ')}"></div><div class="field" style="grid-column:1/-1"><label>Address</label><input id="tpAddress" value="${t.address}"></div></div>`,`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveTechProfile('${id}')">Save Technician</button>`)}
let pendingTechPhoto='';function previewTechPhoto(input){let f=input.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{pendingTechPhoto=r.result;$('#techPreview').src=r.result;$('#techPreview').style.visibility='visible'};r.readAsDataURL(f)}
function saveTechProfile(id){let name=$('#tpName').value.trim();if(!name)return toast('Technician name is required');let t=db.technicians.find(x=>x.id===id);let data={name,role:$('#tpRole').value,phone:$('#tpPhone').value,email:$('#tpEmail').value,birthday:$('#tpBirthday').value,hireDate:$('#tpHire').value,hourlyRate:+$('#tpRate').value||0,commissionRate:+$('#tpCommission').value||0,emergencyContact:$('#tpEmergency').value,skills:$('#tpSkills').value.split(',').map(x=>x.trim()).filter(Boolean),address:$('#tpAddress').value};if(t){Object.assign(t,data);if(pendingTechPhoto)t.photo=pendingTechPhoto}else{db.technicians.push({id:uid('tech'),...data,photo:pendingTechPhoto,status:'Available',clockStatus:'Clocked Out',clockIn:'',breakStart:'',hoursThisWeek:0,turn:db.technicians.length+1,sales:0,tips:0,customers:0,current:'',last:''})}pendingTechPhoto='';save();closeModal();go('technicians');toast('Technician saved')}
function clockAction(id){let t=db.technicians.find(x=>x.id===id);openModal(t.name+' Time Clock',`<div class="kpi-grid"><div class="kpi"><span>Status</span><b>${t.clockStatus}</b></div><div class="kpi"><span>Hours This Week</span><b>${(+t.hoursThisWeek).toFixed(1)}</b></div></div><div class="management-grid" style="margin-top:14px"><button class="btn good" onclick="recordClock('${id}','Clock In')">Clock In</button><button class="btn danger" onclick="recordClock('${id}','Clock Out')">Clock Out</button><button class="btn warn" onclick="recordClock('${id}','Start Break')">Start Break</button><button class="btn" onclick="recordClock('${id}','End Break')">End Break</button></div>`,`<button class="btn primary" onclick="closeModal()">Done</button>`)}
function recordClock(id,action){let t=db.technicians.find(x=>x.id===id),now=new Date();if(action==='Clock In'){t.clockStatus='Clocked In';t.clockIn=now.toISOString();t.status='Available'}if(action==='Clock Out'){if(t.clockIn)t.hoursThisWeek+=(now-new Date(t.clockIn))/3600000;t.clockStatus='Clocked Out';t.clockIn='';t.status='Clocked Out'}if(action==='Start Break'){t.clockStatus='On Break';t.breakStart=now.toISOString();t.status='Break'}if(action==='End Break'){t.clockStatus='Clocked In';t.breakStart='';t.status='Available'}db.timeClock.unshift({id:uid('tc'),techId:id,action,time:now.toISOString()});save();closeModal();renderTechnicians();toast(action+' recorded')}
function timeClockDashboard(){openModal('Time Clock Dashboard',`<div class="table-wrap"><table class="table"><thead><tr><th>Technician</th><th>Status</th><th>Hours</th><th>Rate</th><th>Action</th></tr></thead><tbody>${db.technicians.map(t=>`<tr><td>${t.name}</td><td>${t.clockStatus}</td><td>${(+t.hoursThisWeek).toFixed(1)}</td><td>${money(t.hourlyRate)}</td><td><button class="btn small" onclick="closeModal();clockAction('${t.id}')">Open</button></td></tr>`).join('')}</tbody></table></div>`,`<button class="btn primary" onclick="closeModal()">Close</button>`)}
function payrollDashboard(){let total=0;openModal('Hourly Payroll',`<div class="table-wrap"><table class="table"><thead><tr><th>Technician</th><th>Hours</th><th>Hourly Rate</th><th>Hourly Pay</th><th>Commission</th><th>Total</th></tr></thead><tbody>${db.technicians.map(t=>{let hp=t.hoursThisWeek*t.hourlyRate,com=t.sales*t.commissionRate/100,tot=hp+com;total+=tot;return `<tr><td>${t.name}</td><td>${t.hoursThisWeek.toFixed(1)}</td><td><input style="width:90px" type="number" value="${t.hourlyRate}" onchange="db.technicians.find(x=>x.id==='${t.id}').hourlyRate=+this.value;save()"></td><td>${money(hp)}</td><td>${money(com)}</td><td><b>${money(tot)}</b></td></tr>`}).join('')}</tbody></table></div><div class="summary-line total"><span>Estimated Weekly Payroll</span><b>${money(total)}</b></div>`,`<button class="btn" onclick="window.print()">Print</button><button class="btn primary" onclick="closeModal()">Done</button>`)}
function serviceManager(){openModal('Services & Prices',`<button class="btn primary" onclick="editServiceModal()">＋ Add Service</button><div class="table-wrap" style="margin-top:12px"><table class="table"><thead><tr><th>Category</th><th>Service</th><th>Duration</th><th>Price</th><th>Action</th></tr></thead><tbody>${db.services.map(x=>`<tr><td>${x.category}</td><td>${x.name}</td><td>${x.duration} min</td><td>${money(x.price)}</td><td><button class="btn small" onclick="editServiceModal('${x.id}')">Edit</button></td></tr>`).join('')}</tbody></table></div>`,`<button class="btn primary" onclick="closeModal()">Done</button>`)}
function editServiceModal(id=''){let x=db.services.find(s=>s.id===id)||{category:'Manicure',name:'',duration:30,price:0};openModal(id?'Edit Service':'Add Service',`<div class="stack"><div class="field"><label>Category</label><input id="svCat" value="${x.category}"></div><div class="field"><label>Service Name</label><input id="svName" value="${x.name}"></div><div class="grid g2"><div class="field"><label>Duration</label><input id="svDuration" type="number" value="${x.duration}"></div><div class="field"><label>Price</label><input id="svPrice" type="number" step=".01" value="${x.price}"></div></div></div>`,`<button class="btn" onclick="serviceManager()">Back</button><button class="btn primary" onclick="saveService('${id}')">Save</button>`)}
function saveService(id){let x=db.services.find(s=>s.id===id),data={category:$('#svCat').value,name:$('#svName').value,duration:+$('#svDuration').value,price:+$('#svPrice').value};if(!data.name)return toast('Service name required');if(x)Object.assign(x,data);else db.services.push({id:uid('s'),...data});save();serviceManager();toast('Service saved')}
function salonSettingsModal(){openModal('Salon Information',`<div class="stack"><div class="field"><label>Salon Name</label><input id="ssSalon" value="${db.settings.salon}"></div><div class="field"><label>Tax Rate (%)</label><input id="ssTax" type="number" value="${db.settings.taxRate}"></div><div class="field"><label>GHL Booking Link</label><input id="ssGHL" value="${db.settings.ghlBookingLink}"></div><label class="row"><input id="ssTip" type="checkbox" ${db.settings.tipOn?'checked':''}> Enable Tips</label></div>`,`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveSalonSettings()">Save</button>`)}
function saveSalonSettings(){Object.assign(db.settings,{salon:$('#ssSalon').value,taxRate:+$('#ssTax').value,ghlBookingLink:$('#ssGHL').value,tipOn:$('#ssTip').checked});save();closeModal();toast('Salon settings saved')}
function expenseDashboard(){openModal('Operating Costs & Discounts',`<div class="grid g2"><div class="field"><label>Monthly Supplies Cost</label><input id="exSup" type="number" value="${db.settings.suppliesCost}"></div><div class="field"><label>Monthly Marketing Cost</label><input id="exMkt" type="number" value="${db.settings.marketingCost}"></div><div class="field"><label>Monthly Rent / Occupancy</label><input id="exRent" type="number" value="${db.settings.rentCost}"></div><div class="field"><label>Other Monthly Costs</label><input id="exOther" type="number" value="${db.settings.otherCost}"></div></div><div class="meta" style="margin-top:12px">Ticket discounts are tracked separately from operating costs.</div>`,`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveExpenses()">Save Costs</button>`)}
function saveExpenses(){Object.assign(db.settings,{suppliesCost:+$('#exSup').value,marketingCost:+$('#exMkt').value,rentCost:+$('#exRent').value,otherCost:+$('#exOther').value});save();closeModal();renderReports();toast('Costs saved')}
function profitDashboard(){let revenue=db.receipts.reduce((a,r)=>a+r.total,0),monthlyCosts=(+db.settings.suppliesCost||0)+(+db.settings.marketingCost||0)+(+db.settings.rentCost||0)+(+db.settings.otherCost||0),monthlyPayroll=db.technicians.reduce((a,t)=>a+t.hoursThisWeek*t.hourlyRate,0)*4.33,profit=revenue-monthlyCosts-monthlyPayroll;openModal('Quarter & Annual Profit',`<div class="kpi-grid"><div class="kpi"><span>Estimated Monthly Profit</span><b>${money(profit)}</b></div><div class="kpi"><span>Estimated Quarter Profit</span><b>${money(profit*3)}</b></div><div class="kpi"><span>Estimated Annual Profit</span><b>${money(profit*12)}</b></div></div><div class="card" style="box-shadow:none;margin-top:14px"><div class="summary-line"><span>Revenue in Stored Receipts</span><b>${money(revenue)}</b></div><div class="summary-line"><span>Monthly Payroll Estimate</span><b>${money(monthlyPayroll)}</b></div><div class="summary-line"><span>Monthly Operating Costs</span><b>${money(monthlyCosts)}</b></div></div><p class="muted">This browser demo estimates quarter and annual profit from the current stored revenue pattern. Connect accounting data for official financial reporting.</p>`,`<button class="btn" onclick="window.print()">Print</button><button class="btn primary" onclick="closeModal()">Close</button>`)}
function printerModal(){openModal('Printer Setup',`<div class="stack"><div class="field"><label>Receipt Printer</label><select><option>Browser Print</option><option>EPSON TM-T88</option><option>Star TSP100</option></select></div><div class="field"><label>Paper Size</label><select><option>80mm</option><option>58mm</option><option>Letter</option></select></div><button class="btn" onclick="toast('Test print sent')">Test Print</button></div>`,`<button class="btn primary" onclick="closeModal()">Done</button>`)}

function updateClock(){let d=new Date();$('#clockTime').textContent=d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});$('#clockDate').textContent=d.toLocaleDateString([],{weekday:'long',month:'short',day:'numeric',year:'numeric'})}
initNav();updateClock();setInterval(updateClock,30000);go('floor');
</script>
</body>
</html>
